<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sandwich Clicker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Sandwich Clicker</h1>
  <div>
    <p>Clicks: <span id="clickCount">0</span></p>
    <p>Rebirths: <span id="rebirthCount">0</span></p>
  </div>

  <button id="clickBtn">Click Sandwich!</button>
  <button id="rebirthBtn">Rebirth (Costs 100 Clicks)</button>

  <!-- Firebase Modular SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 1. Replace with your actual Firebase config from the Firebase Console
    const firebaseConfig = {
  apiKey: "AIzaSyCsdsIdq3mCkvGcNaikUmyHnAD7nGjQdUE",
  authDomain: "sandwichclicker.firebaseapp.com",
  projectId: "sandwichclicker",
  storageBucket: "sandwichclicker.firebasestorage.app",
  messagingSenderId: "227365631893",
  appId: "1:227365631893:web:9920e730b45a3d95bb689c",
  measurementId: "G-MLMRT4S5WQ"
};

    // Initialize Firebase & Firestore
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Game state variables
    let clicks = 0;
    let rebirths = 0;
    let currentUser = null;

    // DOM Elements
    const clickCountEl = document.getElementById("clickCount");
    const rebirthCountEl = document.getElementById("rebirthCount");
    const clickBtn = document.getElementById("clickBtn");
    const rebirthBtn = document.getElementById("rebirthBtn");

    // Update UI elements
    function updateUI() {
      clickCountEl.textContent = clicks;
      rebirthCountEl.textContent = rebirths;
    }

    // 2. Load User Data from Firestore NoSQL Database
    async function loadUserData(uid) {
      const userDocRef = doc(db, "users", uid);
      const userDoc = await getDoc(userDocRef);

      if (userDoc.exists()) {
        const data = userDoc.data();
        clicks = data.clicks || 0;
        rebirths = data.rebirths || 0;
      } else {
        // Create new user record in Firestore
        await setDoc(userDocRef, {
          clicks: 0,
          rebirths: 0,
          createdAt: new Date()
        });
      }
      updateUI();
    }

    // 3. Save User Data to Firestore
    async function saveGameData() {
      if (!currentUser) return;
      const userDocRef = doc(db, "users", currentUser.uid);
      await updateDoc(userDocRef, {
        clicks: clicks,
        rebirths: rebirths
      });
    }

    // Auto-save periodically (every 600 seconds) to prevent spamming database calls on every click
    setInterval(saveGameData, 600000);

    // 4. Game Action Handlers
    clickBtn.addEventListener("click", () => {
      clicks += (rebirths + 1); // Extra clicks per rebirth
      updateUI();
    });

    rebirthBtn.addEventListener("click", () => {
      const rebirthCost = 100;
      if (clicks >= rebirthCost) {
        clicks -= rebirthCost;
        rebirths += 1;
        updateUI();
        saveGameData(); // Save immediately on rebirth
      } else {
        alert("Not enough clicks to rebirth!");
      }
    });

    // 5. Authenticate User Anonymously on Load
    signInAnonymously(auth).catch((error) => {
      console.error("Authentication Error:", error);
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        loadUserData(user.uid);
      }
    });

    // Save game data when user leaves or refreshes the page
    window.addEventListener("beforeunload", () => {
      saveGameData();
    });
  </script>
</body>
</html>
