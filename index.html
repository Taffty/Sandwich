<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sandwich Clicker</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #172033;
      background: linear-gradient(135deg, #ffdf24 0%, #ffb51b 55%, #ff8d12 100%);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 22px;
      background: #ffdc20;
      border-bottom: 5px solid #eaa000;
      box-shadow: 0 4px 12px #5c390033;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: clamp(1.2rem, 3vw, 2rem);
      font-weight: 800;
    }

    .brand-icon { font-size: 2.2rem; }

    .counter-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 20px;
      background: #fff2c8;
      border: 2px solid #e8a923;
      border-radius: 16px;
      box-shadow: 0 3px 0 #d58b12;
    }

    .counter-card .sandwich-small { font-size: 2.7rem; }
    .counter-label { font-size: 0.9rem; font-weight: 700; }
    #counter { font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 900; color: #8d4200; }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(260px, 0.8fr);
      gap: 18px;
      max-width: 1400px;
      margin: 0 auto;
      padding: 18px;
    }

    .game-panel, .side-panel {
      border: 3px solid #172238;
      border-radius: 22px;
      box-shadow: 0 8px 0 #b36a0b55, 0 12px 24px #63340022;
      overflow: hidden;
    }

    .game-panel {
      min-height: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 26px;
      background:
        radial-gradient(circle at center, #fff7d5 0%, #ffe78b 56%, #ffcb43 100%);
      position: relative;
    }

    .game-panel::before {
      content: "🥪     ✨      🥪";
      position: absolute;
      top: 22px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 2rem;
      opacity: 0.35;
      pointer-events: none;
    }

    .instructions {
      margin: 12px 0 22px;
      color: #71400a;
      font-weight: 700;
      text-align: center;
    }

    #sandwichButton {
      border: 0;
      background: transparent;
      cursor: pointer;
      font-size: clamp(8rem, 23vw, 17rem);
      line-height: 1.1;
      padding: 10px;
      filter: drop-shadow(0 12px 0 #a75b0c44);
      transition: transform 0.09s ease, filter 0.09s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #sandwichButton:hover {
      transform: translateY(-5px) scale(1.03);
      filter: drop-shadow(0 17px 0 #a75b0c44);
    }

    #sandwichButton:active {
      transform: translateY(5px) scale(0.97);
      filter: drop-shadow(0 4px 0 #a75b0c44);
    }

    .click-hint {
      margin: 4px 0 0;
      color: #75410a;
      font-weight: 800;
      font-size: 1.05rem;
    }

    .side-panel {
      background: #172238;
      color: #f5f7ff;
      padding: 20px;
      align-self: start;
    }

    .side-panel h2 {
      margin: 0 0 12px;
      font-size: 1.4rem;
    }

    .side-panel p {
      line-height: 1.5;
      color: #d8e1f3;
    }

    .progress-track {
      height: 18px;
      background: #0c1423;
      border: 1px solid #4a5870;
      border-radius: 99px;
      overflow: hidden;
      margin: 16px 0 8px;
    }

    #progressBar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ffb31a, #ffeb58);
      transition: width 0.15s ease;
    }

    #progressText {
      color: #ffe25b;
      font-weight: 800;
      font-size: 0.95rem;
    }

    #rebirthButton {
      display: none;
      width: 100%;
      margin-top: 20px;
      padding: 15px 12px;
      border: 2px solid #fff08b;
      border-radius: 12px;
      background: linear-gradient(#ffeb54, #ffae12);
      color: #402400;
      font-size: 1.15rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 5px 0 #ad6500;
    }

    #rebirthButton:hover { filter: brightness(1.06); }
    #rebirthButton:active { transform: translateY(3px); box-shadow: 0 2px 0 #ad6500; }

    .rebirth-note {
      min-height: 42px;
      margin-bottom: 0;
      font-size: 0.9rem;
    }

    @media (max-width: 760px) {
      .topbar { align-items: flex-start; flex-direction: column; }
      main { grid-template-columns: 1fr; padding: 12px; }
      .game-panel { min-height: 430px; }
      .side-panel { order: 2; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-icon">🥪</span> Sandwich Clicker</div>
    <div class="counter-card" aria-live="polite">
      <span class="sandwich-small">🥪</span>
      <div>
        <div class="counter-label">Sandwiches</div>
        <div id="counter">0</div>
      </div>
    </div>
  </header>

  <main>
    <section class="game-panel" aria-label="Sandwich clicking area">
      <button id="sandwichButton" aria-label="Click the sandwich to earn one sandwich">🥪</button>
      <p class="click-hint">Click the sandwich!</p>
      <p class="instructions">Every click earns 1 sandwich. Your progress saves automatically.</p>
    </section>

    <aside class="side-panel">
      <h2>🔄 Rebirth</h2>
      <p>Reach <strong>50 sandwiches</strong> to unlock Rebirth. Rebirth resets your sandwich count back to zero.</p>
      <div class="progress-track" aria-label="Progress toward rebirth">
        <div id="progressBar"></div>
      </div>
      <div id="progressText">0 / 50 sandwiches</div>
      <button id="rebirthButton">🔄 Rebirth — Reset Count</button>
      <p class="rebirth-note" id="statusMessage" aria-live="polite">You need 50 sandwiches to unlock rebirth.</p>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
