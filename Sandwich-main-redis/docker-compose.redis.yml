services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    restart: unless-stopped
    volumes:
      - sandwich-redis-data:/data

  api:
    build: ./server
    depends_on:
      - redis
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      PORT: 3000
      TEST_MODE: "${TEST_MODE:-false}"
      MAX_CLICKS_PER_SECOND: 15
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:5500}"
    ports:
      - "3000:3000"

volumes:
  sandwich-redis-data:
